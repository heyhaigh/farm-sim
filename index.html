<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Propagate — pixel-art worker Ryans grown from Ryan's SuperMemory knowledge graph, farming under a CRT sky.">
    <title>Propagate | heyhaigh.ai</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; background: #000; }
        #tv {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            cursor: crosshair;
            touch-action: none;
        }
        #mobile-gate {
            display: none;
            position: fixed;
            inset: 0;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #e6e5de;
            font-family: monospace;
            font-size: 16px;
            letter-spacing: 0.08em;
            line-height: 1.6;
            text-align: center;
            text-transform: uppercase;
            padding: 24px;
            z-index: 9999;
        }
        #mobile-gate strong {
            display: block;
            color: #ffd24a;
            font-size: 20px;
            margin-bottom: 12px;
        }
        /* Codex #62-1 — `hover`/`pointer` describe only the PRIMARY pointing device, so a touch-first
           laptop matches (hover: none) and (pointer: coarse) even though it also has a trackpad or mouse.
           That blocked a perfectly capable machine from the game entirely. `any-hover`/`any-pointer` ask
           whether ANY attached device qualifies, so the gate now means "there is no usable pointer here"
           rather than "the main pointer is a finger". Kept as a not() around the capable case so a device
           reporting nothing useful still gets the notice.
           Written as four PLAIN feature queries rather than `not(... or ...)`: if a browser cannot parse the
           condition it drops the whole rule, which on a phone would mean a blank canvas with the notice
           hidden — worse than either outcome the gate is choosing between. */
        @media (hover: none) and (pointer: coarse) and (any-hover: none) and (any-pointer: coarse) {
            #tv { display: none; }
            #mobile-gate { display: flex; }
        }
    </style>
</head>
<body>
    <canvas id="tv"></canvas>
    <div id="mobile-gate" role="status">
        <div>
            <strong>Desktop required</strong>
            Propagate is built for a mouse and keyboard.<br>
            Open this page on a desktop to play.
        </div>
    </div>
    <script type="module" src="./main.js"></script>
</body>
</html>
