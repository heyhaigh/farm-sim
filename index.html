<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Propagate — pixel-art worker Ryans grown from Ryan's SuperMemory knowledge graph, farming under a CRT sky.">
    <title>Propagate | heyhaigh.ai</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; background: #000; }
        #tv {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            cursor: crosshair;
            touch-action: none;
        }
        /* The gate is the ONLY thing a phone ever sees, so it has to be in the game's language rather than a
           plain web page — same near-black, same phosphor green (#7dd069), same gold (#f0d060), scanlines and
           a slow flicker standing in for the CRT shader the canvas would have applied. Pure CSS on purpose:
           main.js returns before it renders anything on mobile, so nothing here can rely on the game. */
        #mobile-gate {
            display: none;
            position: fixed;
            inset: 0;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, #0b1410 0%, #05070a 70%);
            color: #c8ccd8;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 15px;
            letter-spacing: 0.14em;
            line-height: 1.9;
            text-align: center;
            text-transform: uppercase;
            padding: 28px;
            z-index: 9999;
            overflow: hidden;
        }
        /* scanlines + a corner vignette: the two cheapest cues that read as "this is that CRT" */
        #mobile-gate::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                repeating-linear-gradient(180deg, rgba(0,0,0,0.55) 0 2px, rgba(0,0,0,0) 2px 4px),
                radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.75) 100%);
            animation: gate-flicker 5.5s steps(2, end) infinite;
        }
        @keyframes gate-flicker { 0%, 96% { opacity: 1; } 97% { opacity: 0.86; } 100% { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { #mobile-gate::before { animation: none; } }

        #mobile-gate .gate-inner { position: relative; max-width: 24ch; }
        /* the wordmark, with the CRT's chromatic fringing faked in text-shadow */
        #mobile-gate .gate-title {
            display: block;
            color: #7dd069;
            font-size: 26px;
            letter-spacing: 0.3em;
            margin-bottom: 22px;
            text-shadow: -1px 0 rgba(255,64,64,0.55), 1px 0 rgba(64,160,255,0.55), 0 0 14px rgba(125,208,105,0.45);
        }
        #mobile-gate strong {
            display: block;
            color: #f0d060;
            font-size: 17px;
            letter-spacing: 0.18em;
            margin-bottom: 14px;
        }
        #mobile-gate .gate-note {
            display: block;
            margin-top: 22px;
            color: #6a6f7c;
            font-size: 12px;
            letter-spacing: 0.1em;
        }
        /* Mobile styling keys off `entry-mobile`, stamped ONCE by the entry chooser below — NOT off a live
           media query. A live query re-evaluates mid-session: a 2-in-1 shedding its keyboard mid-game would
           have flipped `pointer-events: none` onto a running game's canvas (every input handler attaches
           there, so the game goes deaf) and, since the load timer arms `gate-fallback` on every visit, laid
           the plain-text notice over a live town. Which experience a visitor gets is decided once, at load,
           in one place. This also retires the old rule that the query stay character-identical in three
           places — it now lives only in the entry chooser and main.js's defence-in-depth guard. */
        /* 100svh, not the inherited 100vh: on iOS, vh is the LARGE viewport (browser chrome retracted), so
           the canvas extended behind the bottom bar and a mathematically-centred composition sat visibly low.
           svh is the small viewport — always fully on screen. Browsers without svh ignore the declaration and
           keep the base 100vh, which is exactly the old behaviour. */
        html.entry-mobile #tv { pointer-events: none; touch-action: none; height: 100svh; }
        /* The plain-text block is only a fallback for "the gate never rendered". The inline script below
           arms it on a timer; the canvas gate normally sets `gate-live` long before that. */
        html.entry-mobile.gate-fallback:not(.gate-live) #mobile-gate { display: flex; }
    </style>
</head>
<body>
    <canvas id="tv"></canvas>
    <div id="mobile-gate" role="status">
        <div class="gate-inner">
            <span class="gate-title">Propagate</span>
            <strong>Desktop only</strong>
            Try on a different device.
                    </div>
    </div>
    <script>
        // ONE entry or the other, never both. A phone loading main.js would execute its whole module scope —
        // measured at 96 image requests and ~2MB of art on production, plus the entire sim graph — to show a
        // static notice. mobile-gate.js pulls in crt.js, pixel.js and the one title sheet instead.
        // The query must stay character-identical to the guard in main.js (its only other copy).
        // Codex #62-1 — `hover`/`pointer` describe only the PRIMARY pointer, so a touch-first laptop
        // matches them despite having a trackpad; `any-hover`/`any-pointer` exempt any machine with a
        // usable pointer attached. Four PLAIN feature queries, no not(): an unparseable query returns
        // matches:false here, which fails toward the FULL game — heavy on a phone, but functional.
        (function () {
            var MOBILE = window.matchMedia('(hover: none) and (pointer: coarse) and (any-hover: none) and (any-pointer: coarse)').matches;
            // stamp the decision for CSS; nothing re-evaluates it, so a mid-session capability change
            // (detached keyboard, unplugged mouse) cannot disturb a running game
            if (MOBILE) document.documentElement.classList.add('entry-mobile');
            // Desktop loses the preload scanner's head start once the entry is chosen in script rather than
            // written in markup, so hand it back explicitly. Skipped on the gate path, which does not want it.
            if (!MOBILE) {
                var l = document.createElement('link');
                l.rel = 'modulepreload'; l.href = './main.js';
                document.head.appendChild(l);
            }
            var s = document.createElement('script');
            s.type = 'module';
            s.src = MOBILE ? './mobile-gate.js' : './main.js';
            document.head.appendChild(s);

            // If the chosen entry never arrives (offline, blocked, a bad deploy) a phone would sit on black
            // forever. Reveal the plain-text notice only in that case: the gate adds `gate-live` after its
            // FIRST SUCCESSFUL FRAME, so on any healthy load this lands on a rule that no longer matches.
            setTimeout(function () { document.documentElement.classList.add('gate-fallback'); }, 6000);
        })();
    </script>
</body>
</html>
